[project]
name = "signal-scholar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "azamshoaib", email = "shoaibaza@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-ninja>=1.7.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[project.scripts]
signal-scholar = "signal_scholar:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "signal_scholar.settings"
testpaths = ["tests"]
