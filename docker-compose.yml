services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signal_scholar}
      POSTGRES_USER: ${POSTGRES_USER:-signal_scholar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal_scholar_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-signal_scholar} -d $${POSTGRES_DB:-signal_scholar}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
